<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e40af"><link rel="manifest" href="manifest.webmanifest"><title>Nd値 連続音声入力</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:620px;margin:auto;padding:12px}.head,.card{border-radius:18px}.head{background:#1e40af;color:white;padding:18px}.head h1{margin:0;font-size:24px}.head p{margin:6px 0 0;color:#dbeafe}.card{background:white;margin-top:12px;padding:16px;box-shadow:0 1px 4px #0002}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700}input,select{width:100%;margin-top:5px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:19px;background:white}button{border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;min-height:50px}.primary{width:100%;height:76px;background:#1d4ed8;color:white;font-size:19px}.stop{background:#dc2626}.green{background:#059669;color:white}.outline{background:white;border:1px solid #cbd5e1}.share{background:#16a34a;color:white}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.msg,.notice{padding:12px;border-radius:12px;margin-top:10px;font-size:14px}.msg{background:#f1f5f9}.notice{background:#fffbeb;color:#78350f}.next{text-align:center;background:#eff6ff;padding:12px;border-radius:12px;margin-top:12px}.next b{display:block;font-size:30px;color:#1e3a8a}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:center}th{background:#f8fafc;position:sticky;top:0}.scroll{max-height:360px;overflow:auto;border:1px solid #e2e8f0;border-radius:12px}.hidden{display:none}.small{font-size:12px;color:#64748b}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:450px){.actions{grid-template-columns:1fr}.head h1{font-size:21px}}
</style></head><body><main class="app"><header class="head"><h1>Nd値 連続音声入力</h1><p>音声入力、照合、CSV保存・共有</p></header>
<section class="card"><h2>入力条件</h2><label>測点名・孔番<input id="point" placeholder="例：No.1"></label><div class="grid" style="margin-top:10px"><label>開始深度 (m)<input id="start" type="number" step="0.1" value="0.0"></label><label>入力間隔 (m)<select id="interval"><option value="0.1">0.10</option><option value="0.2">0.20</option><option value="0.25">0.25</option><option value="0.5">0.50</option><option value="1">1.00</option></select></label></div><div class="next">次の入力深度<b id="next">0.00 m</b></div></section>
<section class="card"><button id="voice" class="primary">🎤 連続音声入力を開始</button><div id="status" class="msg">例：「3、5、5、8、12、欠測、15」</div></section>
<section id="review" class="card hidden"><h2>音声終了後の照合：<span id="draftCount">0</span>件</h2><div class="notice">メモ帳と照合し、深度・Nd値の誤認識を直接修正してください。</div><div class="scroll" style="margin-top:10px"><table><thead><tr><th>No.</th><th>深度 (m)</th><th>Nd値</th></tr></thead><tbody id="draftBody"></tbody></table></div><div class="two" style="margin-top:10px"><button id="undo" class="outline">最後を削除</button><button id="clear" class="outline">全部やり直す</button></div><button id="confirm" class="green" style="width:100%;margin-top:10px">✓ 照合済みとして確定</button></section>
<section class="card"><h2>照合・確定済み：<span id="recordCount">0</span>件</h2><div class="scroll"><table><thead><tr><th>No.</th><th>深度 (m)</th><th>Nd値</th></tr></thead><tbody id="recordBody"></tbody></table></div><div class="actions" style="margin-top:12px"><button id="save" class="outline" disabled>CSV保存</button><button id="email" class="outline" disabled>メール</button><button id="share" class="share" disabled>LINE等で共有</button></div><p id="shareStatus" class="small">共有画面からLINE、Gmail、Outlookなどを選択できます。</p></section></main><script>
const $=id=>document.getElementById(id);let draft=[],records=[],listening=false,rec;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const fmt=n=>Number(n).toFixed(2);function nextDepth(){return Number($('start').value)+records.length*Number($('interval').value)}function refresh(){ $('next').textContent=fmt(nextDepth())+' m';$('draftCount').textContent=draft.length;$('recordCount').textContent=records.length;$('review').classList.toggle('hidden',!draft.length);$('draftBody').innerHTML=draft.map((x,i)=>`<tr><td>${i+1}</td><td><input data-i="${i}" data-f="depth" type="number" step="0.1" value="${x.depth}"></td><td><input data-i="${i}" data-f="value" type="number" value="${x.value}"></td></tr>`).join('');$('recordBody').innerHTML=records.map((x,i)=>`<tr><td>${i+1}</td><td>${fmt(x.depth)}</td><td><b>${x.value}</b></td></tr>`).join('');const ok=records.length&&draft.length===0;['save','email','share'].forEach(id=>$(id).disabled=!ok);$('start').disabled=$('interval').disabled=records.length||draft.length}
function parse(text){const s=text.replace(/[、，,／/]/g,' ').replace(/ここまで|確定|登録|入力|終了/g,' ').replace(/欠側|決測|けっそく/g,'欠測');const ts=s.match(/欠測|-?\d+(?:\.\d+)?/g)||[];const base=nextDepth()+draft.length*Number($('interval').value);draft.push(...ts.map((t,i)=>({depth:Number((base+i*Number($('interval').value)).toFixed(3)),value:t==='欠測'?'':Number(t),state:t==='欠測'?'欠測':''})));$('status').textContent=ts.length?`${ts.length}件を認識しました。メモ帳と照合してください。`:'数字を認識できませんでした。';refresh()}
$('voice').onclick=()=>{if(!SR)return alert('Android版Chromeで開き、マイクを許可してください。');if(listening){rec.stop();return}rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=true;let final='';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;e.results[i].isFinal?final+=' '+t:interim+=t}$('status').textContent='認識中：'+(final+' '+interim).trim()};rec.onend=()=>{listening=false;$('voice').classList.remove('stop');$('voice').textContent='🎤 連続音声入力を開始';if(final.trim())parse(final)};rec.onerror=()=>{$('status').textContent='音声認識を中断しました。';};listening=true;$('voice').classList.add('stop');$('voice').textContent='■ 読み上げを停止';rec.start()};
$('draftBody').oninput=e=>{const i=+e.target.dataset.i,f=e.target.dataset.f;if(f)draft[i][f]=e.target.value===''?'':Number(e.target.value)};$('undo').onclick=()=>{draft.pop();refresh()};$('clear').onclick=()=>{draft=[];refresh()};$('confirm').onclick=()=>{if(draft.some(x=>x.depth===''||x.value===''))return alert('空欄があります。欠測の場合はNd値を0にして、出力後に状態を確認してください。');records.push(...draft);draft=[];$('status').textContent='照合済みとして確定しました。CSVを保存・共有できます。';refresh()};
function csv(){return '\ufeff測点名,深度(m),Nd値,状態\r\n'+records.map(r=>`"${$('point').value.replaceAll('"','""')}",${r.depth},${r.value},${r.state||''}`).join('\r\n')}function file(){return new File([csv()],($('point').value||'Nd値')+'_確認済み.csv',{type:'text/csv;charset=utf-8'})}function download(){const a=document.createElement('a');a.href=URL.createObjectURL(file());a.download=file().name;a.click();URL.revokeObjectURL(a.href)}async function share(){const f=file();try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))await navigator.share({title:'Nd値データ',text:'確認済みNd値CSVです。',files:[f]});else{download();$('shareStatus').textContent='CSVを保存しました。LINEやメールに添付してください。'}}catch(e){if(e.name!=='AbortError')$('shareStatus').textContent='共有できませんでした。CSV保存を利用してください。'}}$('save').onclick=download;$('share').onclick=share;$('email').onclick=share;['start','interval'].forEach(id=>$(id).oninput=refresh);refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
